<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hương Vị Việt - Ẩm thực Việt Nam</title><style>:root{--red:#c0392b;--red-d:#9b2c20;--gold:#f5a623;--bg:#fffaf3;--ink:#2b2420;--muted:#7a6f66;--line:#eadfd1;--card:#fff}
*{box-sizing:border-box}body{margin:0;font-family:'Segoe UI',system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
a{color:var(--red);text-decoration:none}a:hover{text-decoration:underline}
h1,h2,h3{line-height:1.25;margin:.4em 0}h2{font-size:1.6rem}
.container{max-width:1120px;margin:0 auto;padding:0 20px}.narrow{max-width:760px}.section{padding:32px 20px}.center{text-align:center}.muted{color:var(--muted)}.grow{flex:1}
.header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.header-in{display:flex;align-items:center;gap:24px;height:64px}.logo{font-weight:800;font-size:1.3rem;color:var(--red)}
.nav{display:flex;gap:18px;flex:1}.nav a{color:var(--ink);padding:6px 2px;border-bottom:2px solid transparent}.nav a.active{border-color:var(--red);color:var(--red)}
.actions{display:flex;align-items:center;gap:10px}.cart-btn{position:relative;font-size:1.4rem}.badge{position:absolute;top:-8px;right:-12px;background:var(--red);color:#fff;font-size:.7rem;border-radius:99px;padding:1px 6px}
.user-chip{background:#f7efe3;padding:6px 12px;border-radius:99px;color:var(--ink);font-size:.9rem}
.btn{background:var(--red);color:#fff;border:0;border-radius:10px;padding:9px 18px;font-weight:600;cursor:pointer;font-size:.95rem}.btn:hover{background:var(--red-d);text-decoration:none}
.btn.ghost{background:transparent;color:var(--red);border:1px solid var(--red)}.btn.small{padding:6px 12px;font-size:.85rem;white-space:nowrap}.btn.big{padding:12px 26px;font-size:1.05rem;display:inline-block}.btn.block{width:100%}
.hero{background:linear-gradient(120deg,#fff1d6,#ffd9c7)}.hero-in{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:56px 20px}
.hero h1{font-size:2.6rem;margin:0 0 12px}.hero p{max-width:480px;font-size:1.1rem}.hero-art{font-size:150px;position:relative}.hero-art span{position:absolute;font-size:60px}.hero-art span:nth-child(1){right:-20px;top:0}.hero-art span:nth-child(2){left:-30px;bottom:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}.news-grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:.2s;display:block;color:inherit}.card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(120,80,40,.12);text-decoration:none}
.card-body{padding:12px 14px 14px}.card h3{margin:.3em 0;font-size:1.05rem}.card h3 a{color:var(--ink)}
.thumb{display:flex;align-items:center;justify-content:center;border-radius:0}.detail .thumb{border-radius:16px}
.tag{display:inline-block;background:#f7efe3;color:var(--red);font-size:.75rem;padding:2px 10px;border-radius:99px;font-weight:600}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.price{color:var(--red);font-size:1.05rem}.price.big{font-size:1.8rem;font-weight:800}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:20px}.chips{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 16px;cursor:pointer}.chip.on{background:var(--red);color:#fff;border-color:var(--red)}
input,textarea,select{font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;width:100%}.search{width:220px}select{width:auto}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin:20px 0 32px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:#fff}.qty button{border:0;background:none;width:34px;height:34px;font-size:1.1rem;cursor:pointer}.qty span{min-width:28px;text-align:center}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0;display:flex;flex-direction:column;gap:10px}
.review{border-bottom:1px solid var(--line);padding:12px 0}.review p{margin:.3em 0}
.cart-layout{display:grid;grid-template-columns:1fr 340px;gap:24px}.cart-row{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}.cart-row .thumb{width:84px;flex:none;border-radius:10px}.cart-row .thumb span{font-size:36px!important}
.line-total{min-width:90px;text-align:right}.icon-btn{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1rem}
.total{font-size:1.15rem}hr{border:0;border-top:1px solid var(--line);width:100%}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.modal{background:#fff;border-radius:16px;padding:26px;width:min(380px,92vw);display:flex;flex-direction:column;gap:12px}.error{color:#c0392b;margin:0;font-size:.9rem}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2b2420;color:#fff;padding:10px 20px;border-radius:99px;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.25)}.toast.err{background:#c0392b}
.lead{font-size:1.15rem;color:var(--muted)}
.footer{border-top:1px solid var(--line);padding:24px 0;margin-top:40px;background:#fff;text-align:center}
@media(max-width:760px){.nav{display:none}.hero-art{display:none}.hero h1{font-size:2rem}.detail,.cart-layout{grid-template-columns:1fr}.header-in{gap:10px}}
